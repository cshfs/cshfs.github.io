<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק קפיצות - סופר פלטפורמה</title>
    <!-- שימוש ב-Tailwind CSS לעיצוב הממשק מעל הקנבס -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* צבע שמיים בסיסי */
            touch-action: none; /* מונע גלילה מקרית בטלפון */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* מאפשר לחיצות לעבור לקנבס אם צריך */
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- שכבת ממשק משתמש (UI) -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 sm:p-6">
        
        <!-- עליון: ניקוד והודעות -->
        <div class="flex justify-between items-start w-full pointer-events-auto">
            <div class="text-white text-3xl font-bold text-shadow">
                שלב: <span id="levelDisplay">1</span> | ניקוד: <span id="scoreDisplay">0</span>
            </div>
            
            <div class="flex flex-col items-end gap-4">
                <div id="messageBox" class="hidden flex flex-col items-center bg-white/90 px-8 py-6 rounded-2xl shadow-2xl backdrop-blur-sm border-4 border-gray-200">
                    <h1 id="messageText" class="text-4xl sm:text-5xl font-extrabold text-red-500 mb-4">פסלת!</h1>
                    <button id="restartBtn" class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold text-xl shadow-lg transition-transform transform hover:scale-105">
                        התחל מחדש
                    </button>
                </div>
            </div>
        </div>

        <!-- תחתון: כפתורי שליטה למובייל (מוסתרים במסכים גדולים) -->
        <div class="absolute bottom-0 left-0 w-full flex justify-between items-end p-4 pb-8 lg:hidden pointer-events-auto opacity-80" dir="ltr">
            <div class="flex gap-2">
                <button id="btnLeft" class="bg-gray-800 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-gray-600 select-none">◄</button>
                <button id="btnRight" class="bg-gray-800 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-gray-600 select-none">►</button>
            </div>
            <div class="flex gap-2">
                <button id="btnShoot" class="bg-red-500 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-red-400 select-none">🎯</button>
                <button id="btnJump" class="bg-blue-600 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-blue-400 select-none">▲</button>
            </div>
        </div>
    </div>

    <!-- אזור הציור של המשחק -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const restartBtn = document.getElementById('restartBtn');

        // התאמת הקנבס לגודל החלון
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- מערכת סאונד מובנית (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'doubleJump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.05);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'stomp') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(800, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        // --- מערכת חלקיקים (אפקטים) ---
        let particles = [];
        let screenShake = 0;

        function createParticles(x, y, color, count, speedModifier = 1) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6 * speedModifier,
                    vy: (Math.random() - 0.5) * 6 * speedModifier,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03; // קצב ההעלמות
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;
        }

        // --- הגדרות המשחק ---
        const GRAVITY = 0.6;
        const TERMINAL_VELOCITY = 15;
        
        let gameState = 'playing'; // 'playing', 'gameover', 'won'
        let score = 0;
        let cameraX = 0;
        let cameraY = 0;
        let animationFrameId;

        // מקשים
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // --- אובייקטים של המשחק ---
        let player, platforms, coins, enemies, finishLine;
        let bullets = [];
        let lastShotTime = 0;
        let currentLevel = 1;
        const levelDisplay = document.getElementById('levelDisplay');

        function loadLevel(levelNum) {
            currentLevel = levelNum;
            if (levelDisplay) levelDisplay.innerText = currentLevel;
            gameState = 'playing';
            messageBox.classList.add('hidden');
            bullets = [];
            particles = [];
            screenShake = 0;

            // הגדרת השחקן
            player = {
                x: 100,
                y: 100,
                w: 40,
                h: 40,
                vx: 0,
                vy: 0,
                speed: 6,
                jumpPower: -13,
                grounded: false,
                facingRight: true,
                color: '#ef4444', // אדום בסגנון מריו
                currentJumps: 0, // לקפיצה כפולה
                maxJumps: 2      // לקפיצה כפולה
            };

            const groundY = 500; // רצפה בסיסית וקבועה

            if (levelNum === 1) {
                // --- שלב 1: ההתחלתי והבסיסי ---
                platforms = [
                    { x: 0, y: groundY, w: 1000, h: 200 },
                    { x: 400, y: groundY - 120, w: 150, h: 20 },
                    { x: 700, y: groundY - 220, w: 150, h: 20 },
                    { x: 1200, y: groundY, w: 800, h: 200 },
                    { x: 1400, y: groundY - 150, w: 100, h: 20 },
                    { x: 1600, y: groundY - 250, w: 100, h: 20 },
                    { x: 1800, y: groundY - 350, w: 100, h: 20 },
                    { x: 2200, y: groundY, w: 1200, h: 200 },
                    { x: 2500, y: groundY - 100, w: 200, h: 100 },
                ];
                coins = [
                    { x: 460, y: groundY - 160, w: 20, h: 20, collected: false },
                    { x: 760, y: groundY - 260, w: 20, h: 20, collected: false },
                    { x: 950, y: groundY - 40, w: 20, h: 20, collected: false },
                    { x: 1440, y: groundY - 190, w: 20, h: 20, collected: false },
                    { x: 1640, y: groundY - 290, w: 20, h: 20, collected: false },
                    { x: 1840, y: groundY - 390, w: 20, h: 20, collected: false },
                    { x: 2550, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 2600, y: groundY - 140, w: 20, h: 20, collected: false },
                ];
                enemies = [
                    { x: 700, y: groundY - 40, w: 40, h: 40, vx: 2, minX: 600, maxX: 950, active: true, type: 'walker' },
                    { x: 1500, y: groundY - 40, w: 40, h: 40, vx: 2.5, minX: 1200, maxX: 1950, active: true, type: 'walker' },
                    { x: 2300, y: groundY - 40, w: 40, h: 40, vx: 3, minX: 2200, maxX: 2450, active: true, type: 'walker' }
                ];
                finishLine = { x: 3100, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            } 
            else if (levelNum === 2) {
                // --- שלב 2: יותר תהומות ואויבים קצת יותר מהירים ---
                platforms = [
                    { x: 0, y: groundY, w: 500, h: 200 },
                    { x: 650, y: groundY, w: 300, h: 200 },
                    { x: 1100, y: groundY - 100, w: 150, h: 20 },
                    { x: 1400, y: groundY, w: 400, h: 200 },
                    { x: 1900, y: groundY - 120, w: 100, h: 20 },
                    { x: 2100, y: groundY - 220, w: 100, h: 20 },
                    { x: 2300, y: groundY, w: 800, h: 200 }
                ];
                coins = [
                    { x: 450, y: groundY - 40, w: 20, h: 20, collected: false },
                    { x: 1160, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 1940, y: groundY - 160, w: 20, h: 20, collected: false },
                    { x: 2140, y: groundY - 260, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    { x: 700, y: groundY - 40, w: 40, h: 40, vx: 3, minX: 650, maxX: 900, active: true, type: 'walker' },
                    { x: 1500, y: groundY - 40, w: 40, h: 40, vx: 4, minX: 1400, maxX: 1750, active: true, type: 'walker' },
                    { x: 2500, y: groundY - 40, w: 40, h: 40, vx: 4, minX: 2300, maxX: 2900, active: true, type: 'walker' }
                ];
                finishLine = { x: 2950, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 3) {
                // --- שלב 3: קפיצות מדויקות על פלטפורמות קטנות באוויר ---
                platforms = [
                    { x: 0, y: groundY, w: 300, h: 200 },
                    { x: 450, y: groundY - 80, w: 80, h: 20 },
                    { x: 650, y: groundY - 160, w: 80, h: 20 },
                    { x: 850, y: groundY - 240, w: 80, h: 20 },
                    { x: 1100, y: groundY, w: 300, h: 200 },
                    { x: 1500, y: groundY - 100, w: 200, h: 20 },
                    { x: 1800, y: groundY, w: 200, h: 200 },
                    { x: 2200, y: groundY - 50, w: 50, h: 20 },
                    { x: 2400, y: groundY - 150, w: 50, h: 20 },
                    { x: 2600, y: groundY, w: 600, h: 200 }
                ];
                coins = [
                    { x: 480, y: groundY - 120, w: 20, h: 20, collected: false },
                    { x: 680, y: groundY - 200, w: 20, h: 20, collected: false },
                    { x: 880, y: groundY - 280, w: 20, h: 20, collected: false },
                    { x: 1580, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 2215, y: groundY - 90, w: 20, h: 20, collected: false },
                    { x: 2415, y: groundY - 190, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    { x: 1200, y: groundY - 40, w: 40, h: 40, vx: 2, minX: 1100, maxX: 1350, active: true, type: 'walker' },
                    { x: 1550, y: groundY - 140, w: 40, h: 40, vx: 3, minX: 1500, maxX: 1650, active: true, type: 'walker' },
                    { x: 2800, y: groundY - 40, w: 40, h: 40, vx: 5, minX: 2600, maxX: 3100, active: true, type: 'walker' }
                ];
                finishLine = { x: 3050, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 4) {
                // --- שלב 4: תהומות ענקיים! חייבים קפיצה כפולה ---
                platforms = [
                    { x: 0, y: groundY, w: 400, h: 200 },
                    { x: 800, y: groundY, w: 200, h: 200 }, // תהום של 400! דורש קפיצה כפולה
                    { x: 1400, y: groundY - 50, w: 150, h: 200 },
                    { x: 2000, y: groundY - 100, w: 100, h: 200 },
                    { x: 2500, y: groundY - 200, w: 80, h: 20 },
                    { x: 2900, y: groundY, w: 600, h: 200 }
                ];
                coins = [
                    { x: 600, y: groundY - 100, w: 20, h: 20, collected: false }, // מטבע באוויר מעל התהום
                    { x: 1150, y: groundY - 100, w: 20, h: 20, collected: false },
                    { x: 1750, y: groundY - 150, w: 20, h: 20, collected: false },
                    { x: 2250, y: groundY - 200, w: 20, h: 20, collected: false },
                    { x: 2530, y: groundY - 240, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    { x: 850, y: groundY - 40, w: 40, h: 40, vx: 2, minX: 800, maxX: 950, active: true, type: 'walker' },
                    { x: 1450, y: groundY - 90, w: 40, h: 40, vx: 2, minX: 1400, maxX: 1500, active: true, type: 'walker' },
                    { x: 3000, y: groundY - 40, w: 40, h: 40, vx: 4, minX: 2900, maxX: 3400, active: true, type: 'walker' }
                ];
                finishLine = { x: 3350, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 5) {
                // --- שלב 5: אויבים מרחפים ופלטפורמות צפופות ---
                platforms = [
                    { x: 0, y: groundY, w: 300, h: 200 },
                    { x: 500, y: groundY, w: 250, h: 200 },
                    { x: 900, y: groundY, w: 250, h: 200 },
                    { x: 1300, y: groundY, w: 250, h: 200 },
                    { x: 1700, y: groundY, w: 800, h: 200 }
                ];
                coins = [
                    { x: 400, y: groundY - 50, w: 20, h: 20, collected: false },
                    { x: 800, y: groundY - 50, w: 20, h: 20, collected: false },
                    { x: 1200, y: groundY - 50, w: 20, h: 20, collected: false },
                    { x: 1900, y: groundY - 100, w: 20, h: 20, collected: false },
                    { x: 2100, y: groundY - 100, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    // אויבים מרחפים - סוג חדש שלא מצריך שינוי גרפיקה! משתמשים באותה תמונת פטריה
                    { x: 400, y: groundY - 150, startY: groundY - 150, w: 40, h: 40, vx: 0, active: true, type: 'flying' },
                    { x: 800, y: groundY - 150, startY: groundY - 150, w: 40, h: 40, vx: 0, active: true, type: 'flying' },
                    { x: 1200, y: groundY - 150, startY: groundY - 150, w: 40, h: 40, vx: 0, active: true, type: 'flying' },
                    { x: 1800, y: groundY - 40, w: 40, h: 40, vx: 3, minX: 1700, maxX: 2400, active: true, type: 'walker' },
                    { x: 2200, y: groundY - 40, w: 40, h: 40, vx: -4, minX: 1700, maxX: 2400, active: true, type: 'walker' }
                ];
                finishLine = { x: 2350, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 6) {
                // --- שלב 6: טיפוס קשוח במיוחד ---
                platforms = [
                    { x: 0, y: groundY, w: 300, h: 200 },
                    { x: 400, y: groundY - 100, w: 100, h: 20 },
                    { x: 600, y: groundY - 200, w: 100, h: 20 },
                    { x: 800, y: groundY - 300, w: 100, h: 20 },
                    { x: 1100, y: groundY - 250, w: 100, h: 20 },
                    { x: 1400, y: groundY - 150, w: 100, h: 20 },
                    { x: 1700, y: groundY - 50, w: 100, h: 20 },
                    { x: 2000, y: groundY, w: 800, h: 200 },
                    { x: 2150, y: groundY - 120, w: 80, h: 20 },
                    { x: 2350, y: groundY - 240, w: 80, h: 20 }
                ];
                coins = [
                    { x: 440, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 640, y: groundY - 240, w: 20, h: 20, collected: false },
                    { x: 840, y: groundY - 340, w: 20, h: 20, collected: false },
                    { x: 1140, y: groundY - 290, w: 20, h: 20, collected: false },
                    { x: 2180, y: groundY - 160, w: 20, h: 20, collected: false },
                    { x: 2380, y: groundY - 280, w: 20, h: 20, collected: false },
                    { x: 2600, y: groundY - 100, w: 20, h: 20, collected: false },
                    { x: 2650, y: groundY - 100, w: 20, h: 20, collected: false },
                    { x: 2700, y: groundY - 100, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    { x: 950, y: groundY - 300, startY: groundY - 300, w: 40, h: 40, vx: 0, active: true, type: 'flying' },
                    { x: 1250, y: groundY - 200, startY: groundY - 200, w: 40, h: 40, vx: 0, active: true, type: 'flying' },
                    { x: 1550, y: groundY - 100, startY: groundY - 100, w: 40, h: 40, vx: 0, active: true, type: 'flying' },
                    { x: 2100, y: groundY - 40, w: 40, h: 40, vx: 5, minX: 2000, maxX: 2750, active: true, type: 'walker' }
                ];
                finishLine = { x: 2650, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }

            cameraX = 0;
            cameraY = 0;
        }

        // --- פונקציית עזר לזום ---
        function getZoom() {
            return window.innerWidth < 800 ? window.innerWidth / 800 : 1;
        }

        // --- בדיקת התנגשות בין שני מלבנים ---
        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.h > r2.y;
        }

        // --- ירייה ---
        function shoot() {
            if (gameState !== 'playing') return;
            const now = Date.now();
            if (now - lastShotTime < 300) return; // השהיה בין יריות
            lastShotTime = now;

            bullets.push({
                x: player.facingRight ? player.x + player.w : player.x - 10,
                y: player.y + player.h / 2 - 5,
                w: 10,
                h: 10,
                vx: player.facingRight ? 12 : -12
            });
            playSound('shoot');
        }

        // --- עדכון הפיזיקה וההיגיון של המשחק ---
        function gameLogic() {
            if (gameState !== 'playing') return;

            // תנועה אופקית (X)
            if (keys.left) {
                player.vx = -player.speed;
            } else if (keys.right) {
                player.vx = player.speed;
            } else {
                player.vx *= 0.8; // חיכוך כשהשחקן לא לוחץ כלום
            }

            // החלת התנועה האופקית על השחקן
            player.x += player.vx;

            // מניעת יציאה מגבולות השלב (שמאלה)
            if (player.x < 0) {
                player.x = 0;
                player.vx = 0;
            }

            // בדיקת התנגשות בציר ה-X עם פלטפורמות
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) { // זז ימינה ונתקע בקיר
                        player.x = p.x - player.w;
                    } else if (player.vx < 0) { // זז שמאלה ונתקע בקיר
                        player.x = p.x + p.w;
                    }
                    player.vx = 0;
                }
            }

            // תנועה אנכית (Y) כוח משיכה
            player.vy += GRAVITY;
            if (player.vy > TERMINAL_VELOCITY) player.vy = TERMINAL_VELOCITY;
            
            player.y += player.vy;
            player.grounded = false;

            // בדיקת התנגשות בציר ה-Y עם פלטפורמות
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) { // נופל למטה ופוגע ברצפה
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                        player.currentJumps = 0; // איפוס קפיצה כפולה
                    } else if (player.vy < 0) { // קופץ למעלה ופוגע בתקרה
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            }

            // עדכון אויבים
            for (let enemy of enemies) {
                if (!enemy.active) continue;
                
                // תנועת האויב בהתאם לסוג
                if (enemy.type === 'walker') {
                    enemy.x += enemy.vx;
                    if (enemy.x > enemy.maxX || enemy.x < enemy.minX) {
                        enemy.vx *= -1; // החלפת כיוון
                    }
                } else if (enemy.type === 'flying') {
                    // אויב מעופף משתמש בגלים לנוע למעלה ולמטה
                    enemy.y = enemy.startY + Math.sin(Date.now() * 0.003 + enemy.x) * 50;
                }

                // התנגשות עם אויב
                if (checkCollision(player, enemy)) {
                    // בדיקה אם השחקן קופץ על האויב מלמעלה
                    if (player.vy > 0 && player.y + player.h - player.vy <= enemy.y + 15) {
                        enemy.active = false; // האויב הובס
                        player.vy = player.jumpPower * 0.8; // קפיצה קטנה לאחר מעיכת אויב
                        score += 50;
                        scoreDisplay.innerText = score;
                        playSound('stomp');
                        createParticles(enemy.x + enemy.w/2, enemy.y + enemy.h/2, '#8b4513', 15);
                    } else {
                        // השחקן נפגע - נפסל
                        gameOver(false);
                    }
                }
            }

            // איסוף מטבעות
            for (let coin of coins) {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    score += 10;
                    scoreDisplay.innerText = score;
                    playSound('coin');
                    createParticles(coin.x + coin.w/2, coin.y + coin.h/2, '#fbbf24', 10);
                }
            }

            // עדכון יריות
            let zoom = getZoom();
            let logicalWidth = canvas.width / zoom;
            
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;

                // הסרת ירייה אם יצאה מהמסך
                if (b.x < cameraX - 100 || b.x > cameraX + logicalWidth + 100) {
                    bullets.splice(i, 1);
                    continue;
                }

                // פגיעה בפלטפורמה
                let hitPlatform = false;
                for (let p of platforms) {
                    if (checkCollision(b, p)) {
                        hitPlatform = true;
                        createParticles(b.x + b.w/2, b.y + b.h/2, '#f97316', 5);
                        break;
                    }
                }
                if (hitPlatform) {
                    bullets.splice(i, 1);
                    continue;
                }

                // פגיעה באויב
                let hitEnemy = false;
                for (let enemy of enemies) {
                    if (enemy.active && checkCollision(b, enemy)) {
                        enemy.active = false;
                        hitEnemy = true;
                        score += 50;
                        scoreDisplay.innerText = score;
                        playSound('stomp');
                        createParticles(enemy.x + enemy.w/2, enemy.y + enemy.h/2, '#8b4513', 15);
                        break;
                    }
                }
                if (hitEnemy) {
                    bullets.splice(i, 1);
                }
            }

            updateParticles();

            // הגעה לסיום (דגל)
            if (player.x + player.w > finishLine.x) {
                gameOver(true);
            }

            // נפילה לתהום (נפסל)
            if (player.y > 1000) {
                gameOver(false);
            }

            // עדכון מצלמה - עוקבת אחרי השחקן
            let logicalHeight = canvas.height / zoom;
            
            let targetCameraX = player.x - logicalWidth / 3;
            if (targetCameraX < 0) targetCameraX = 0;
            cameraX += (targetCameraX - cameraX) * 0.1; 
            
            let targetCameraY = player.y - logicalHeight / 2;
            let maxCameraY = 500 + 200 - logicalHeight;
            // בשלבים גבוהים נאפשר למצלמה לעלות יותר
            if (currentLevel >= 6) maxCameraY = 800;
            if (targetCameraY > maxCameraY) targetCameraY = maxCameraY;
            cameraY += (targetCameraY - cameraY) * 0.1;
        }

        // --- ציור כל האלמנטים על המסך ---
        function draw() {
            // ניקוי המסך ושמיים
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let zoom = getZoom();
            ctx.scale(zoom, zoom);
            
            // הוספת אפקט רעידת מסך אם קיים
            let shakeX = 0;
            let shakeY = 0;
            if (screenShake > 0) {
                shakeX = (Math.random() - 0.5) * screenShake;
                shakeY = (Math.random() - 0.5) * screenShake;
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }
            
            ctx.translate(-Math.floor(cameraX) + shakeX, -Math.floor(cameraY) + shakeY); // הזזת עולם המשחק לרוחב ולגובה

            // ציור עננים ונוף (רקע)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(300, 150, 40, 0, Math.PI * 2);
            ctx.arc(350, 150, 50, 0, Math.PI * 2);
            ctx.arc(400, 150, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(1200, 100, 40, 0, Math.PI * 2);
            ctx.arc(1250, 100, 60, 0, Math.PI * 2);
            ctx.arc(1320, 100, 40, 0, Math.PI * 2);
            ctx.fill();

            // ציור דגל סיום
            ctx.fillStyle = '#A0AEC0'; // תורן הדגל
            ctx.fillRect(finishLine.x, finishLine.y, finishLine.w, finishLine.h);
            ctx.fillStyle = '#48BB78'; // דגל ירוק
            
            // הורדת הדגל אם השחקן ניצח
            let flagDrawY = finishLine.flagY;
            if (gameState === 'won') {
                flagDrawY = finishLine.y + finishLine.h - 40;
            }
            ctx.beginPath();
            ctx.moveTo(finishLine.x + finishLine.w, flagDrawY);
            ctx.lineTo(finishLine.x + 80, flagDrawY + 20);
            ctx.lineTo(finishLine.x + finishLine.w, flagDrawY + 40);
            ctx.fill();

            // ציור פלטפורמות (אדמה)
            ctx.fillStyle = '#4ade80'; // ירוק דשא
            for (let p of platforms) {
                // דשא למעלה
                ctx.fillRect(p.x, p.y, p.w, 15);
                // אדמה חומה למטה
                ctx.fillStyle = '#a16207'; 
                ctx.fillRect(p.x, p.y + 15, p.w, p.h - 15);
                ctx.fillStyle = '#4ade80'; // חזרה לדשא
                
                // מסגרת לפלטפורמות באוויר
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            }

            // ציור מטבעות
            for (let coin of coins) {
                if (!coin.collected) {
                    let squeeze = Math.abs(Math.cos(Date.now() * 0.005));
                    ctx.save();
                    ctx.translate(coin.x + coin.w/2, coin.y + coin.h/2);
                    ctx.scale(squeeze, 1); // אפקט סיבוב תלת מימד
                    
                    ctx.fillStyle = '#fbbf24'; // צהוב זהב
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.w/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // פס פנימי למטבע 
                    ctx.fillStyle = '#d97706';
                    ctx.fillRect(-2, -coin.w/4, 4, coin.w/2);
                    
                    ctx.restore();
                }
            }

            // ציור אויבים (סגנון גומבה פטריה)
            for (let enemy of enemies) {
                if (enemy.active) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);
                    
                    let legOffset = Math.sin(Date.now() * 0.01) * 4;
                    if (enemy.type === 'flying') legOffset = 0; // אויב מעופף לא מזיז רגליים
                    
                    // רגליים שחורות בתנועה
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.ellipse(10 - legOffset, 36, 6, 4, 0, 0, Math.PI*2);
                    ctx.ellipse(30 + legOffset, 36, 6, 4, 0, 0, Math.PI*2);
                    ctx.fill();

                    // גוף/ראש חום
                    ctx.fillStyle = '#8b4513';
                    ctx.beginPath();
                    ctx.moveTo(0, 32);
                    ctx.quadraticCurveTo(20, -10, 40, 32);
                    ctx.fill();

                    // עיניים
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(14, 16, 4, 6);
                    ctx.fillRect(22, 16, 4, 6);
                    ctx.fillStyle = '#000000';
                    const pupilOffset = enemy.vx > 0 ? 2 : 0;
                    ctx.fillRect(14 + pupilOffset, 18, 2, 4);
                    ctx.fillRect(22 + pupilOffset, 18, 2, 4);
                    
                    // גבות כועסות
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(10, 14); ctx.lineTo(18, 18);
                    ctx.moveTo(30, 14); ctx.lineTo(22, 18);
                    ctx.stroke();

                    ctx.restore();
                }
            }

            // ציור יריות
            ctx.fillStyle = '#f97316'; // כתום לאש
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ea580c';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // ציור חלקיקים (האפקט החדש)
            drawParticles();

            // ציור השחקן (סגנון מריו)
            if (gameState !== 'gameover' || screenShake > 0) { // מצייר רק אם לא נפסל לגמרי (מלבד זמן הרעידה)
                ctx.save();
                ctx.translate(player.x + player.w/2, player.y + player.h/2);
                if (!player.facingRight) ctx.scale(-1, 1); // הופך את הדמות שמאלה/ימינה
                ctx.translate(-player.w/2, -player.h/2);

                let moving = Math.abs(player.vx) > 0.5 && player.grounded;
                let legOffset = moving ? Math.sin(Date.now() * 0.015) * 6 : 0;
                
                // יד אחורית
                ctx.fillStyle = '#fca5a5';
                ctx.fillRect(4 - legOffset/2, 20, 6, 6);

                // רגליים מתנפנפות (סרבל)
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(10 - legOffset, 30, 8, 8);
                ctx.fillRect(22 + legOffset, 30, 8, 8);

                // נעליים
                ctx.fillStyle = '#451a03';
                ctx.fillRect(6 - legOffset, 36, 12, 6);
                ctx.fillRect(18 + legOffset, 36, 12, 6);

                // חולצה אדומה (גוף)
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(8, 16, 24, 14);
                
                // סרבל קדמי כחול
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(12, 22, 16, 10);
                
                // כפתורי סרבל צהובים
                ctx.fillStyle = '#fde047';
                ctx.fillRect(12, 22, 4, 4);
                ctx.fillRect(24, 22, 4, 4);

                // יד קדמית
                ctx.fillStyle = '#fca5a5';
                ctx.fillRect(30 + legOffset/2, 20, 6, 6);

                // ראש (צבע גוף)
                ctx.fillStyle = '#fca5a5'; 
                ctx.fillRect(10, 6, 20, 14);
                
                // אף
                ctx.fillRect(26, 12, 6, 4);
                
                // עין
                ctx.fillStyle = 'black';
                ctx.fillRect(22, 8, 4, 6); 
                
                // שפם
                ctx.fillRect(24, 14, 10, 4);
                
                // כובע אדום עם מצחיה
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(8, 0, 22, 8);
                ctx.fillRect(16, 0, 20, 4);

                ctx.restore();
            }

            // סיום הטרנספורמציה של המצלמה
            ctx.restore();
        }

        // --- סיום המשחק (נצחון או הפסד) ---
        function gameOver(win) {
            if (gameState !== 'playing') return; // מונע הפעלה כפולה
            
            gameState = win ? 'won' : 'gameover';
            messageBox.classList.remove('hidden');
            
            if (win) {
                playSound('win');
                if (currentLevel < 6) {
                    messageText.innerText = "סיימת את שלב " + currentLevel + "!";
                    messageText.className = "text-4xl sm:text-5xl font-extrabold text-green-500 mb-4";
                    restartBtn.innerText = "המשך לשלב הבא";
                } else {
                    messageText.innerText = "אללוף! סיימת הכל!";
                    messageText.className = "text-4xl sm:text-5xl font-extrabold text-yellow-500 mb-4";
                    restartBtn.innerText = "התחל משחק מחדש";
                }
                score += 100; // בונוס סיום
                scoreDisplay.innerText = score;
                createParticles(player.x + player.w/2, player.y + player.h/2, '#4ade80', 50, 2);
            } else {
                playSound('die');
                screenShake = 25; // רעידת מסך חזקה בפסילה
                createParticles(player.x + player.w/2, player.y + player.h/2, '#ef4444', 30, 2); // פיצוץ אדום
                messageText.innerText = "פסלת!";
                messageText.className = "text-4xl sm:text-5xl font-extrabold text-red-500 mb-4";
                restartBtn.innerText = "התחל שלב מחדש";
            }
        }

        // --- לולאת המשחק המרכזית ---
        function update() {
            gameLogic();
            draw();
            
            // ממשיך לקרוא לעדכונים כל עוד המשחק רץ או שאנחנו רוצים לצייר את מסך הסיום
            animationFrameId = requestAnimationFrame(update);
        }

        // --- פונקציה משותפת לטיפול בקפיצה (כולל קפיצה כפולה) ---
        function handleJump() {
            if (gameState !== 'playing') return;
            if (!keys.up) { // רק אם המקש שוחרר מקודם
                if (player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    player.currentJumps = 1;
                    playSound('jump');
                    createParticles(player.x + player.w/2, player.y + player.h, '#ffffff', 5); // אבק
                } else if (player.currentJumps < player.maxJumps) {
                    player.vy = player.jumpPower * 0.85; // קפיצה כפולה קצת חלשה יותר
                    player.currentJumps++;
                    playSound('doubleJump');
                    createParticles(player.x + player.w/2, player.y + player.h, '#60a5fa', 15); // אפקט כחלחל לקפיצה כפולה
                }
            }
            keys.up = true;
        }

        // --- אירועי מקלדת ---
        window.addEventListener('keydown', (e) => {
            initAudio(); // אתחול מערכת הסאונד בלחיצה הראשונה
            if (gameState !== 'playing') return;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; player.facingRight = false; }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; player.facingRight = true; }
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
                handleJump();
            }
            if (e.code === 'KeyZ' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                shoot();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
                keys.up = false;
                // קפיצה נמוכה אם עוזבים את המקש מוקדם
                if (player.vy < 0 && player.currentJumps === 1) { // רק בקפיצה הראשונה מאפשרים קטיעה
                    player.vy *= 0.5;
                }
            }
        });

        // --- אירועי מגע (למובייל) ---
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        const btnShoot = document.getElementById('btnShoot');

        function setupTouch(btn, keyName) {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // מונע התנהגות דפדפן רגילה (כמו זום)
                initAudio();
                if (gameState !== 'playing') return;
                
                if (keyName === 'left') player.facingRight = false;
                if (keyName === 'right') player.facingRight = true;

                if (keyName === 'up') {
                    handleJump();
                } else {
                    keys[keyName] = true;
                }
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyName] = false;
                if (keyName === 'up' && player.vy < 0 && player.currentJumps === 1) {
                    player.vy *= 0.5;
                }
            });
        }

        setupTouch(btnLeft, 'left');
        setupTouch(btnRight, 'right');
        setupTouch(btnJump, 'up');

        if (btnShoot) {
            btnShoot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                shoot();
            });
        }

        // כפתור התחלה מחדש
        restartBtn.addEventListener('click', () => {
            initAudio();
            cancelAnimationFrame(animationFrameId);
            if (gameState === 'won' && currentLevel < 6) {
                loadLevel(currentLevel + 1); // עובר לשלב הבא (עד שלב 6)
            } else if (gameState === 'won' && currentLevel >= 6) {
                score = 0; // ניצחון מוחלט - מתחיל מההתחלה
                scoreDisplay.innerText = score;
                loadLevel(1);
            } else {
                // נפסל - טוען את השלב הנוכחי מחדש מבלי לאפס את הניקוד הקודם
                loadLevel(currentLevel);
            }
            update(); // מפעיל מחדש את לולאת המשחק
        });

        // הפעלת המשחק בפעם הראשונה
        score = 0;
        scoreDisplay.innerText = score;
        loadLevel(1);
        update();

    </script>
</body>
