<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק קפיצות - סופר פלטפורמה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @media (max-width: 1024px) {
            #mobileControls button {
                width: 4.25rem;
                height: 4.25rem;
                font-size: 1.7rem;
            }
        }

        @media (max-width: 740px) and (orientation: landscape) {
            #ui-layer {
                padding: 10px;
            }

            #hudText {
                font-size: 1.05rem;
                line-height: 1.4;
            }

            #mobileControls {
                padding: 10px 14px 12px;
            }

            #mobileControls button {
                width: 3.5rem;
                height: 3.5rem;
                font-size: 1.4rem;
            }

            #messageBox {
                transform: scale(0.9);
                transform-origin: top right;
            }

            #shopPanel .shop-window {
                max-height: 88vh;
            }
        }
    </style>
</head>
<body>

    <div id="ui-layer" class="flex flex-col justify-between p-4 sm:p-6">
        <div class="flex justify-between items-start w-full pointer-events-auto">
            <div id="hudText" class="text-white text-2xl sm:text-3xl font-bold text-shadow">
                שלב: <span id="levelDisplay">1</span> |
                ניקוד: <span id="scoreDisplay">0</span> |
                מטבעות: <span id="coinsDisplay">0</span>
            </div>

            <div class="flex flex-col items-end gap-3">
                <button id="shopBtn" class="bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white px-5 py-2 rounded-xl font-bold shadow-lg">
                    חנות תלבושות
                </button>

                <div id="messageBox" class="hidden flex flex-col items-center bg-white/90 px-8 py-6 rounded-2xl shadow-2xl backdrop-blur-sm border-4 border-gray-200">
                    <h1 id="messageText" class="text-4xl sm:text-5xl font-extrabold text-red-500 mb-4">פסלת!</h1>
                    <button id="restartBtn" class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold text-xl shadow-lg transition-transform transform hover:scale-105">
                        התחל מחדש
                    </button>
                </div>
            </div>
        </div>

        <div id="mobileControls" class="absolute bottom-0 left-0 w-full flex justify-between items-end p-4 pb-8 lg:hidden pointer-events-auto opacity-80" dir="ltr">
            <div class="flex gap-2">
                <button id="btnLeft" class="bg-gray-800 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-gray-600 select-none">◄</button>
                <button id="btnRight" class="bg-gray-800 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-gray-600 select-none">►</button>
            </div>
            <div class="flex gap-2">
                <button id="btnShoot" class="bg-red-500 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-red-400 select-none">🎯</button>
                <button id="btnJump" class="bg-blue-600 text-white w-16 h-16 rounded-full text-3xl font-bold flex justify-center items-center shadow-lg active:bg-blue-400 select-none">▲</button>
            </div>
        </div>

        <div id="shopPanel" class="hidden absolute inset-0 bg-black/45 flex items-center justify-center p-4 pointer-events-auto">
            <div class="shop-window w-full max-w-5xl max-h-[82vh] overflow-auto bg-white/95 rounded-3xl shadow-2xl p-5 sm:p-6 border-4 border-purple-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-purple-700">חנות תלבושות</h2>
                    <button id="closeShopBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-xl font-bold">סגור</button>
                </div>

                <div class="mb-4 text-lg font-bold text-gray-700">
                    המטבעות שלך: <span id="coinsDisplayShop">0</span>
                </div>

                <div id="shopItems" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const coinsDisplay = document.getElementById('coinsDisplay');
        const coinsDisplayShop = document.getElementById('coinsDisplayShop');
        const levelDisplay = document.getElementById('levelDisplay');

        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const restartBtn = document.getElementById('restartBtn');

        const shopBtn = document.getElementById('shopBtn');
        const closeShopBtn = document.getElementById('closeShopBtn');
        const shopPanel = document.getElementById('shopPanel');
        const shopItems = document.getElementById('shopItems');

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        const btnShoot = document.getElementById('btnShoot');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GRAVITY = 0.6;
        const TERMINAL_VELOCITY = 15;
        const TOTAL_LEVELS = 6;
        const STORAGE_KEY = 'super_platformer_costumes_v2';

        let gameState = 'playing';
        let score = 0;
        let totalCoins = 0;
        let cameraX = 0;
        let cameraY = 0;
        let animationFrameId;
        let screenShake = 0;
        let flashAlpha = 0;
        let flashColor = '255,255,255';
        let shopOpen = false;

        const keys = { left: false, right: false, up: false };

        let player, platforms, coins, enemies, finishLine;
        let bullets = [];
        let enemyBullets = [];
        let particles = [];
        let lastShotTime = 0;
        let currentLevel = 1;

        let audioCtx = null;

        const costumes = [
            {
                id: 'classic',
                name: 'קלאסי',
                price: 0,
                shirt: '#ef4444',
                overalls: '#2563eb',
                skin: '#fca5a5',
                hat: '#ef4444',
                shoes: '#451a03'
            },
            {
                id: 'forest',
                name: 'יער',
                price: 6,
                shirt: '#16a34a',
                overalls: '#166534',
                skin: '#f5c7a9',
                hat: '#16a34a',
                shoes: '#3f2a14'
            },
            {
                id: 'shadow',
                name: 'צל',
                price: 10,
                shirt: '#374151',
                overalls: '#111827',
                skin: '#d6b08d',
                hat: '#111827',
                shoes: '#000000'
            },
            {
                id: 'sunset',
                name: 'שקיעה',
                price: 14,
                shirt: '#f97316',
                overalls: '#7c3aed',
                skin: '#f7bf9f',
                hat: '#dc2626',
                shoes: '#6b3f22'
            },
            {
                id: 'ice',
                name: 'קרח',
                price: 18,
                shirt: '#38bdf8',
                overalls: '#1d4ed8',
                skin: '#f7cdb2',
                hat: '#60a5fa',
                shoes: '#1e3a8a'
            },
            {
                id: 'gold',
                name: 'זהב',
                price: 25,
                shirt: '#facc15',
                overalls: '#ca8a04',
                skin: '#f6c7a8',
                hat: '#eab308',
                shoes: '#713f12'
            }
        ];

        let ownedCostumeIds = ['classic'];
        let selectedCostumeId = 'classic';

        function initAudio() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                audioCtx = new Ctx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration, type = 'square', volume = 0.03, slideTo = null) {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo !== null) {
                osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now + duration);
            }

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
        }

        function soundJump() { playTone(420, 0.12, 'square', 0.03, 520); }
        function soundDoubleJump() { playTone(620, 0.16, 'triangle', 0.04, 900); }
        function soundShoot() { playTone(220, 0.08, 'sawtooth', 0.025, 120); }
        function soundEnemyShoot() { playTone(170, 0.09, 'square', 0.02, 140); }
        function soundCoin() { playTone(880, 0.10, 'square', 0.03, 1320); }
        function soundBuy() { playTone(660, 0.10, 'triangle', 0.03, 990); }
        function soundSelect() { playTone(520, 0.08, 'triangle', 0.03, 780); }
        function soundStomp() { playTone(180, 0.12, 'square', 0.04, 90); }
        function soundHit() { playTone(130, 0.28, 'sawtooth', 0.05, 70); }
        function soundWin() {
            playTone(523, 0.10, 'triangle', 0.03, 659);
            setTimeout(() => playTone(659, 0.10, 'triangle', 0.03, 784), 90);
            setTimeout(() => playTone(784, 0.20, 'triangle', 0.04, 988), 180);
        }

        function saveProgress() {
            const data = {
                totalCoins,
                ownedCostumeIds,
                selectedCostumeId
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadProgress() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;

            try {
                const data = JSON.parse(raw);
                if (typeof data.totalCoins === 'number') totalCoins = data.totalCoins;
                if (Array.isArray(data.ownedCostumeIds) && data.ownedCostumeIds.length > 0) {
                    ownedCostumeIds = data.ownedCostumeIds;
                }
                if (typeof data.selectedCostumeId === 'string') {
                    selectedCostumeId = data.selectedCostumeId;
                }
                if (!ownedCostumeIds.includes('classic')) ownedCostumeIds.push('classic');
                if (!ownedCostumeIds.includes(selectedCostumeId)) selectedCostumeId = 'classic';
            } catch (e) {
                ownedCostumeIds = ['classic'];
                selectedCostumeId = 'classic';
                totalCoins = 0;
            }
        }

        function getCurrentCostume() {
            return costumes.find(c => c.id === selectedCostumeId) || costumes[0];
        }

        function updateCoinDisplays() {
            coinsDisplay.innerText = totalCoins;
            coinsDisplayShop.innerText = totalCoins;
        }

        function renderShop() {
            updateCoinDisplays();

            shopItems.innerHTML = costumes.map(costume => {
                const owned = ownedCostumeIds.includes(costume.id);
                const selected = selectedCostumeId === costume.id;

                let actionHtml = '';
                if (selected) {
                    actionHtml = `<button class="w-full bg-green-600 text-white px-4 py-2 rounded-xl font-bold cursor-default">נבחר</button>`;
                } else if (owned) {
                    actionHtml = `<button data-action="select" data-id="${costume.id}" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold">בחר</button>`;
                } else {
                    const canBuy = totalCoins >= costume.price;
                    actionHtml = `<button data-action="buy" data-id="${costume.id}" class="w-full ${canBuy ? 'bg-purple-600 hover:bg-purple-700' : 'bg-gray-400 cursor-not-allowed'} text-white px-4 py-2 rounded-xl font-bold">${canBuy ? 'קנה' : 'חסר מטבעות'}</button>`;
                }

                return `
                    <div class="bg-white border-2 border-purple-200 rounded-2xl p-4 shadow-md">
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-xl font-extrabold text-purple-700">${costume.name}</div>
                            <div class="text-sm font-bold text-gray-700">${owned ? 'ברשותך' : 'מחיר: ' + costume.price}</div>
                        </div>

                        <div class="flex justify-center mb-4">
                            <div class="w-28 h-28 rounded-2xl bg-sky-100 border-2 border-sky-200 flex items-center justify-center">
                                <div class="relative w-14 h-16">
                                    <div class="absolute left-3 top-0 w-8 h-3" style="background:${costume.hat}"></div>
                                    <div class="absolute left-5 top-0 w-8 h-2" style="background:${costume.hat}"></div>
                                    <div class="absolute left-4 top-3 w-7 h-5" style="background:${costume.skin}"></div>
                                    <div class="absolute left-3 top-7 w-8 h-6" style="background:${costume.shirt}"></div>
                                    <div class="absolute left-4 top-10 w-6 h-5" style="background:${costume.overalls}"></div>
                                    <div class="absolute left-2 top-13 w-4 h-2" style="background:${costume.shoes}"></div>
                                    <div class="absolute left-8 top-13 w-4 h-2" style="background:${costume.shoes}"></div>
                                </div>
                            </div>
                        </div>

                        ${actionHtml}
                    </div>
                `;
            }).join('');
        }

        function openShop() {
            shopOpen = true;
            keys.left = false;
            keys.right = false;
            keys.up = false;
            renderShop();
            shopPanel.classList.remove('hidden');
        }

        function closeShop() {
            shopOpen = false;
            shopPanel.classList.add('hidden');
        }

        function addParticles(x, y, color, count, speed = 4) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const s = Math.random() * speed + 1;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * s,
                    vy: Math.sin(angle) * s - 1.5,
                    life: 20 + Math.random() * 20,
                    size: 3 + Math.random() * 4,
                    color
                });
            }
        }

        function setFlash(rgb, alpha = 0.25) {
            flashColor = rgb;
            flashAlpha = Math.max(flashAlpha, alpha);
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.h > r2.y;
        }

        function getZoom() {
            return window.innerWidth < 800 ? window.innerWidth / 800 : 1;
        }

        function createPatrolEnemy(x, y, minX, maxX, vx = 2) {
            return { x, y, w: 40, h: 40, vx, minX, maxX, active: true, type: 'patrol' };
        }

        function createSineEnemy(x, y, minX, maxX, vx = 2.4, amp = 28, speed = 0.08) {
            return {
                x, y, w: 40, h: 40, vx, minX, maxX, active: true,
                type: 'sine',
                baseY: y,
                sineAmp: amp,
                sineSpeed: speed,
                phase: Math.random() * Math.PI * 2
            };
        }

        function createChargerEnemy(x, y, minX, maxX, vx = 2.2, detectRange = 260) {
            return {
                x, y, w: 40, h: 40, vx, minX, maxX, active: true,
                type: 'charger',
                baseSpeed: Math.abs(vx),
                detectRange
            };
        }

        function createHopperEnemy(x, y, minX, maxX, vx = 2.2, amp = 36, speed = 0.12) {
            return {
                x, y, w: 40, h: 40, vx, minX, maxX, active: true,
                type: 'hopper',
                baseY: y,
                hopAmp: amp,
                hopSpeed: speed,
                phase: Math.random() * Math.PI * 2
            };
        }

        function createShooterEnemy(x, y, minX, maxX, vx = 2.1, fireRate = 1400, bulletSpeed = 4.2, range = 420) {
            return {
                x, y, w: 40, h: 40, vx, minX, maxX, active: true,
                type: 'shooter',
                fireRate,
                bulletSpeed,
                range,
                lastFire: 0
            };
        }

        function createTurretEnemy(x, y, fireRate = 1200, bulletSpeed = 4.8, range = 560) {
            return {
                x, y, w: 40, h: 40, vx: 0, minX: x, maxX: x, active: true,
                type: 'turret',
                fireRate,
                bulletSpeed,
                range,
                lastFire: 0
            };
        }

        function fireEnemyBullet(enemy) {
            const ex = enemy.x + enemy.w / 2;
            const ey = enemy.y + enemy.h / 2;
            const px = player.x + player.w / 2;
            const py = player.y + player.h / 2;

            let dx = px - ex;
            let dy = py - ey;
            const dist = Math.hypot(dx, dy) || 1;

            dx /= dist;
            dy /= dist;

            enemyBullets.push({
                x: ex - 5,
                y: ey - 5,
                w: 10,
                h: 10,
                vx: dx * enemy.bulletSpeed,
                vy: dy * enemy.bulletSpeed,
                life: 220
            });

            soundEnemyShoot();
            addParticles(ex, ey, '#7c3aed', 4, 1.8);
        }

        function loadLevel(levelNum) {
            currentLevel = levelNum;
            levelDisplay.innerText = currentLevel;
            gameState = 'playing';
            messageBox.classList.add('hidden');
            bullets = [];
            enemyBullets = [];
            particles = [];
            screenShake = 0;
            flashAlpha = 0;

            player = {
                x: 100,
                y: 100,
                w: 40,
                h: 40,
                vx: 0,
                vy: 0,
                speed: 6,
                jumpPower: -13,
                grounded: false,
                facingRight: true,
                maxJumps: 2,
                jumpsLeft: 2
            };

            const groundY = 500;

            if (levelNum === 1) {
                platforms = [
                    { x: 0, y: groundY, w: 1000, h: 200 },
                    { x: 400, y: groundY - 120, w: 150, h: 20 },
                    { x: 700, y: groundY - 220, w: 150, h: 20 },
                    { x: 1200, y: groundY, w: 800, h: 200 },
                    { x: 1400, y: groundY - 150, w: 100, h: 20 },
                    { x: 1600, y: groundY - 250, w: 100, h: 20 },
                    { x: 1800, y: groundY - 350, w: 100, h: 20 },
                    { x: 2200, y: groundY, w: 1200, h: 200 },
                    { x: 2500, y: groundY - 100, w: 200, h: 100 }

                    { x: 460, y: groundY - 160, w: 20, h: 20, collected: false },
                    { x: 760, y: groundY - 260, w: 20, h: 20, collected: false },
                    { x: 950, y: groundY - 40, w: 20, h: 20, collected: false },
                    { x: 1440, y: groundY - 190, w: 20, h: 20, collected: false },
                    { x: 1640, y: groundY - 290, w: 20, h: 20, collected: false },
                    { x: 1840, y: groundY - 390, w: 20, h: 20, collected: false },
                    { x: 2550, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 2600, y: groundY - 140, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    createPatrolEnemy(700, groundY - 40, 600, 950, 2),
                    createPatrolEnemy(1500, groundY - 40, 1200, 1950, 2.5),
                    createPatrolEnemy(2300, groundY - 40, 2200, 2450, 3)
                ];
                finishLine = { x: 3100, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 2) {
                platforms = [
                    { x: 0, y: groundY, w: 500, h: 200 },
                    { x: 650, y: groundY, w: 300, h: 200 },
                    { x: 1100, y: groundY - 100, w: 150, h: 20 },
                    { x: 1400, y: groundY, w: 400, h: 200 },
                    { x: 1900, y: groundY - 120, w: 100, h: 20 },
                    { x: 2100, y: groundY - 220, w: 100, h: 20 },
                    { x: 2300, y: groundY, w: 800, h: 200 }
                ];
                coins = [
                    { x: 450, y: groundY - 40, w: 20, h: 20, collected: false },
                    { x: 1160, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 1940, y: groundY - 160, w: 20, h: 20, collected: false },
                    { x: 2140, y: groundY - 260, w: 20, h: 20, collected: false },
                    { x: 2860, y: groundY - 40, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    createPatrolEnemy(700, groundY - 40, 650, 900, 3),
                    createChargerEnemy(1500, groundY - 40, 1400, 1750, 2.5, 240),
                    createShooterEnemy(2500, groundY - 40, 2300, 2900, 2.4, 1700, 4.0, 380)
                ];
                finishLine = { x: 2950, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 3) {
                platforms = [
                    { x: 0, y: groundY, w: 300, h: 200 },
                    { x: 450, y: groundY - 80, w: 80, h: 20 },
                    { x: 650, y: groundY - 160, w: 80, h: 20 },
                    { x: 850, y: groundY - 240, w: 80, h: 20 },
                    { x: 1100, y: groundY, w: 300, h: 200 },
                    { x: 1500, y: groundY - 100, w: 200, h: 20 },
                    { x: 1800, y: groundY, w: 200, h: 200 },
                    { x: 2200, y: groundY - 50, w: 50, h: 20 },
                    { x: 2400, y: groundY - 150, w: 50, h: 20 },
                    { x: 2600, y: groundY, w: 600, h: 200 }
                ];
                coins = [
                    { x: 480, y: groundY - 120, w: 20, h: 20, collected: false },
                    { x: 680, y: groundY - 200, w: 20, h: 20, collected: false },
                    { x: 880, y: groundY - 280, w: 20, h: 20, collected: false },
                    { x: 1580, y: groundY - 140, w: 20, h: 20, collected: false },
                    { x: 2215, y: groundY - 90, w: 20, h: 20, collected: false },
                    { x: 2415, y: groundY - 190, w: 20, h: 20, collected: false }
                ];
                enemies = [
                    createPatrolEnemy(1200, groundY - 40, 1100, 1350, 2),
                    createHopperEnemy(1550, groundY - 140, 1500, 1650, 2.4, 24, 0.15),
                    createShooterEnemy(2800, groundY - 40, 2600, 3100, 2.8, 1300, 4.3, 420)
                ];
                finishLine = { x: 3050, y: groundY - 300, w: 10, h: 300, flagY: groundY - 280 };
            }
            else if (levelNum === 4) {
                platforms = [
                    { x: 0, y: groundY, w: 320, h: 200 },
                    { x: 520, y: groundY - 80, w: 120, h: 20 },
                    { x: 760, y: groundY - 170, w: 120, h: 20 },
                    { x: 1020, y: groundY - 250, w: 120, h: 20 },
                    { x: 1300, y: groundY, w: 320, h: 200 },

        function shoot() {
            if (gameState !== 'playing' || shopOpen) return;

            const now = Date.now();
            if (now - lastShotTime < 300) return;
            lastShotTime = now;

            initAudio();
            soundShoot();
            addParticles(player.x + player.w / 2, player.y + player.h / 2, '#f97316', 6, 2.5);

            bullets.push({
                x: player.facingRight ? player.x + player.w : player.x - 10,
                y: player.y + player.h / 2 - 5,
                w: 10,
                h: 10,
                vx: player.facingRight ? 12 : -12
            });
        }

        function tryJump() {
            if (gameState !== 'playing' || shopOpen) return;
            if (player.jumpsLeft <= 0) return;

            initAudio();

            const wasGrounded = player.grounded;
            player.vy = wasGrounded ? player.jumpPower : player.jumpPower * 0.95;
            player.grounded = false;
            player.jumpsLeft--;

            if (wasGrounded) {
                soundJump();
                addParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 8, 2);
            } else {
                soundDoubleJump();
                addParticles(player.x + player.w / 2, player.y + player.h / 2, '#93c5fd', 14, 3.2);
                setFlash('255,255,255', 0.08);
            }
        }

        function updateEnemies() {
            const now = Date.now();

            for (let enemy of enemies) {
                if (!enemy.active) continue;

                if (enemy.type === 'sine') {
                    enemy.x += enemy.vx;
                    if (enemy.x > enemy.maxX || enemy.x < enemy.minX) enemy.vx *= -1;
                    enemy.phase += enemy.sineSpeed;
                    enemy.y = enemy.baseY + Math.sin(enemy.phase) * enemy.sineAmp;
                }
                else if (enemy.type === 'charger') {
                    const distanceX = player.x - enemy.x;
                    let speed = enemy.baseSpeed;
                    let dir = Math.sign(enemy.vx || 1);

                    if (Math.abs(distanceX) < enemy.detectRange && Math.abs(player.y - enemy.y) < 140) {
                        dir = distanceX >= 0 ? 1 : -1;
                        enemy.vx = dir * speed * 1.8;
                    }

                    enemy.x += enemy.vx;
                    if (enemy.x > enemy.maxX) {
                        enemy.x = enemy.maxX;
                        enemy.vx = -speed;
                    } else if (enemy.x < enemy.minX) {
                        enemy.x = enemy.minX;
                        enemy.vx = speed;
                    }
                }
                else if (enemy.type === 'hopper') {
                    enemy.x += enemy.vx;
                    if (enemy.x > enemy.maxX || enemy.x < enemy.minX) enemy.vx *= -1;
                    enemy.phase += enemy.hopSpeed;
                    enemy.y = enemy.baseY - Math.abs(Math.sin(enemy.phase)) * enemy.hopAmp;
                }
                else if (enemy.type === 'shooter') {
                    enemy.x += enemy.vx;
                    if (enemy.x > enemy.maxX || enemy.x < enemy.minX) enemy.vx *= -1;

                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;
                    if (Math.abs(dx) < enemy.range && Math.abs(dy) < 220 && now - enemy.lastFire > enemy.fireRate) {
                        fireEnemyBullet(enemy);
                        enemy.lastFire = now;
                    }
                }
                else if (enemy.type === 'turret') {
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;
                    if (Math.abs(dx) < enemy.range && Math.abs(dy) < 260 && now - enemy.lastFire > enemy.fireRate) {
                        fireEnemyBullet(enemy);
                        enemy.lastFire = now;
                    }
                }
                else {
                    enemy.x += enemy.vx;
                    if (enemy.x > enemy.maxX || enemy.x < enemy.minX) enemy.vx *= -1;
                }

                if (checkCollision(player, enemy)) {
                    if (player.vy > 0 && player.y + player.h - player.vy <= enemy.y + 15) {
                        enemy.active = false;
                        player.vy = player.jumpPower * 0.8;
                        score += 50;
                        scoreDisplay.innerText = score;
                        soundStomp();
                        addParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#8b4513', 14, 3.2);
                        screenShake = Math.max(screenShake, 6);
                    } else {
                        gameOver(false);
                        return;
                    }
                }
            }
        }

        function updateBullets(logicalWidth) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;

                if (b.x < cameraX - 100 || b.x > cameraX + logicalWidth + 100) {
                    bullets.splice(i, 1);
                    continue;
                }

                let hitPlatform = false;
                for (let p of platforms) {
                    if (checkCollision(b, p)) {
                        hitPlatform = true;
                        addParticles(b.x, b.y, '#f97316', 6, 1.8);
                        break;
                    }
                }
                if (hitPlatform) {
                    bullets.splice(i, 1);
                    continue;
                }

                let hitEnemy = false;
                for (let enemy of enemies) {
                    if (enemy.active && checkCollision(b, enemy)) {
                        enemy.active = false;
                        hitEnemy = true;
                        score += 50;
                        scoreDisplay.innerText = score;
                        addParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#f97316', 18, 3.5);
                        screenShake = Math.max(screenShake, 5);
                        soundStomp();
                        break;
                    }
                }
                if (hitEnemy) {
                    bullets.splice(i, 1);
                }
            }
        }

        function updateEnemyBullets(logicalWidth, logicalHeight) {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                if (
                    b.life <= 0 ||
                    b.x < cameraX - 150 ||
                    b.x > cameraX + logicalWidth + 150 ||
                    b.y < cameraY - 150 ||
                    b.y > cameraY + logicalHeight + 150
                ) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                let hitPlatform = false;
                for (let p of platforms) {
                    if (checkCollision(b, p)) {
                        hitPlatform = true;
                        addParticles(b.x, b.y, '#7c3aed', 6, 1.6);
                        break;
                    }
                }
                if (hitPlatform) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (checkCollision(player, b)) {
                    addParticles(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 16, 3.4);
                    enemyBullets.splice(i, 1);
                    gameOver(false);
                    return;
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.vx *= 0.98;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function gameLogic() {
            updateParticles();
            screenShake *= 0.88;
            flashAlpha *= 0.86;

            if (shopOpen) return;
            if (gameState !== 'playing') return;

            if (keys.left) {
                player.vx = -player.speed;
                player.facingRight = false;
            } else if (keys.right) {
                player.vx = player.speed;
                player.facingRight = true;
            } else {
                player.vx *= 0.8;
            }

            player.x += player.vx;

            if (player.x < 0) {
                player.x = 0;
                player.vx = 0;
            }

            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) {
                        player.x = p.x - player.w;
                    } else if (player.vx < 0) {
                        player.x = p.x + p.w;
                    }
                    player.vx = 0;
                }
            }

            player.vy += GRAVITY;
            if (player.vy > TERMINAL_VELOCITY) player.vy = TERMINAL_VELOCITY;

            player.y += player.vy;
            player.grounded = false;

            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                        player.jumpsLeft = player.maxJumps;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            }

            updateEnemies();

            for (let coin of coins) {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    score += 10;
                    totalCoins += 1;
                    scoreDisplay.innerText = score;
                    updateCoinDisplays();
                    saveProgress();
                    soundCoin();
                    addParticles(coin.x + coin.w / 2, coin.y + coin.h / 2, '#fbbf24', 12, 2.4);
                }
            }

            const zoom = getZoom();
            const logicalWidth = canvas.width / zoom;
            const logicalHeight = canvas.height / zoom;

            updateBullets(logicalWidth);
            updateEnemyBullets(logicalWidth, logicalHeight);

            if (player.x + player.w > finishLine.x) {
                gameOver(true);
            }

            if (player.y > 1000) {
                gameOver(false);
            }

            let targetCameraX = player.x - logicalWidth / 3;
            if (targetCameraX < 0) targetCameraX = 0;
            cameraX += (targetCameraX - cameraX) * 0.1;

            let targetCameraY = player.y - logicalHeight / 2;
            const maxCameraY = 500 + 200 - logicalHeight;
            if (targetCameraY > maxCameraY) targetCameraY = maxCameraY;
            cameraY += (targetCameraY - cameraY) * 0.1;
        }

        function drawEnemySprite(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);

            const legOffset = Math.sin(Date.now() * 0.01) * 4;

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(10 - legOffset, 36, 6, 4, 0, 0, Math.PI * 2);
            ctx.ellipse(30 + legOffset, 36, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.moveTo(0, 32);
            ctx.quadraticCurveTo(20, -10, 40, 32);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(14, 16, 4, 6);
            ctx.fillRect(22, 16, 4, 6);
            ctx.fillStyle = '#000000';
            const pupilOffset = enemy.vx > 0 ? 2 : 0;
            ctx.fillRect(14 + pupilOffset, 18, 2, 4);
            ctx.fillRect(22 + pupilOffset, 18, 2, 4);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, 14); ctx.lineTo(18, 18);
            ctx.moveTo(30, 14); ctx.lineTo(22, 18);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            if (screenShake > 0.2) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            const zoom = getZoom();
            ctx.scale(zoom, zoom);
            ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(300, 150, 40, 0, Math.PI * 2);
            ctx.arc(350, 150, 50, 0, Math.PI * 2);
            ctx.arc(400, 150, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(1200, 100, 40, 0, Math.PI * 2);
            ctx.arc(1250, 100, 60, 0, Math.PI * 2);
            ctx.arc(1320, 100, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#A0AEC0';
            ctx.fillRect(finishLine.x, finishLine.y, finishLine.w, finishLine.h);
            ctx.fillStyle = '#48BB78';

            let flagDrawY = finishLine.flagY;
            if (gameState === 'won') {
                flagDrawY = finishLine.y + finishLine.h - 40;
            }
            ctx.beginPath();
            ctx.moveTo(finishLine.x + finishLine.w, flagDrawY);
            ctx.lineTo(finishLine.x + 80, flagDrawY + 20);
            ctx.lineTo(finishLine.x + finishLine.w, flagDrawY + 40);
            ctx.fill();

            ctx.fillStyle = '#4ade80';
            for (let p of platforms) {
                ctx.fillRect(p.x, p.y, p.w, 15);
                ctx.fillStyle = '#a16207';
                ctx.fillRect(p.x, p.y + 15, p.w, p.h - 15);
                ctx.fillStyle = '#4ade80';

                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            }

            for (let coin of coins) {
                if (!coin.collected) {
                    const squeeze = Math.abs(Math.cos(Date.now() * 0.005));
                    ctx.save();
                    ctx.translate(coin.x + coin.w / 2, coin.y + coin.h / 2);
                    ctx.scale(squeeze, 1);

                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#d97706';
                    ctx.fillRect(-2, -coin.w / 4, 4, coin.w / 2);

                    ctx.restore();
                }
            }

            for (let enemy of enemies) {
                if (enemy.active) {
                    drawEnemySprite(enemy);
                }
            }

            ctx.fillStyle = '#f97316';
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ea580c';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.fillStyle = '#7c3aed';
            for (let b of enemyBullets) {
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#4c1d95';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            const costume = getCurrentCostume();

            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
            if (!player.facingRight) ctx.scale(-1, 1);
            ctx.translate(-player.w / 2, -player.h / 2);

            const moving = Math.abs(player.vx) > 0.5 && player.grounded;
            const legOffset = moving ? Math.sin(Date.now() * 0.015) * 6 : 0;

            ctx.fillStyle = costume.skin;
            ctx.fillRect(4 - legOffset / 2, 20, 6, 6);

            ctx.fillStyle = costume.overalls;
            ctx.fillRect(10 - legOffset, 30, 8, 8);
            ctx.fillRect(22 + legOffset, 30, 8, 8);

            ctx.fillStyle = costume.shoes;
            ctx.fillRect(6 - legOffset, 36, 12, 6);
            ctx.fillRect(18 + legOffset, 36, 12, 6);

            ctx.fillStyle = costume.shirt;
            ctx.fillRect(8, 16, 24, 14);

            ctx.fillStyle = costume.overalls;
            ctx.fillRect(12, 22, 16, 10);

            ctx.fillStyle = '#fde047';
            ctx.fillRect(12, 22, 4, 4);
            ctx.fillRect(24, 22, 4, 4);

            ctx.fillStyle = costume.skin;
            ctx.fillRect(30 + legOffset / 2, 20, 6, 6);

            ctx.fillStyle = costume.skin;
            ctx.fillRect(10, 6, 20, 14);

            ctx.fillRect(26, 12, 6, 4);

            ctx.fillStyle = 'black';
            ctx.fillRect(22, 8, 4, 6);
            ctx.fillRect(24, 14, 10, 4);

            ctx.fillStyle = costume.hat;
            ctx.fillRect(8, 0, 22, 8);
            ctx.fillRect(16, 0, 20, 4);

            ctx.restore();

            for (let p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / 40);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            ctx.restore();

            if (flashAlpha > 0.01) {
                ctx.fillStyle = `rgba(${flashColor}, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function gameOver(win) {
            if (gameState !== 'playing') return;

            gameState = win ? 'won' : 'gameover';
            messageBox.classList.remove('hidden');

            if (win) {
                score += 100;
                totalCoins += 2;
                scoreDisplay.innerText = score;
                updateCoinDisplays();
                saveProgress();

                soundWin();
                addParticles(
                    player.x + player.w / 2,
                    player.y + player.h / 2,
                    currentLevel < TOTAL_LEVELS ? '#4ade80' : '#fde047',
                    26,
                    4.5
                );
                setFlash('255,255,255', 0.22);
                screenShake = Math.max(screenShake, 4);

                if (currentLevel < TOTAL_LEVELS) {
                    messageText.innerText = 'סיימת את שלב ' + currentLevel + '!';
                    messageText.className = 'text-4xl sm:text-5xl font-extrabold text-green-500 mb-4';
                    restartBtn.innerText = 'המשך לשלב הבא';
                } else {
                    messageText.innerText = 'אלוף! סיימת הכל!';
                    messageText.className = 'text-4xl sm:text-5xl font-extrabold text-yellow-500 mb-4';
                    restartBtn.innerText = 'התחל משחק מחדש';
                }
            } else {
                soundHit();
                addParticles(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 22, 4.2);
                setFlash('255,0,0', 0.18);
                screenShake = Math.max(screenShake, 8);
                messageText.innerText = 'פסלת!';
                messageText.className = 'text-4xl sm:text-5xl font-extrabold text-red-500 mb-4';
                restartBtn.innerText = 'התחל שלב מחדש';
            }
        }

        function update() {
            gameLogic();
            draw();
            animationFrameId = requestAnimationFrame(update);
        }

        window.addEventListener('keydown', (e) => {
            initAudio();

            if (e.code === 'Escape' && shopOpen) {
                closeShop();
                return;
            }

            if (shopOpen) return;
            if (gameState !== 'playing') return;

            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                keys.left = true;
                player.facingRight = false;
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                keys.right = true;
                player.facingRight = true;
            }
            if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') && !keys.up) {
                keys.up = true;
                tryJump();
            }
            if (e.code === 'KeyZ' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                shoot();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
                keys.up = false;
                if (player && player.vy < 0) player.vy *= 0.5;
            }
        });

        function setupTouch(btn, keyName) {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (shopOpen) return;
                if (gameState !== 'playing') return;

                if (keyName === 'left') player.facingRight = false;
                if (keyName === 'right') player.facingRight = true;

                if (keyName === 'up') {
                    if (!keys.up) tryJump();
                    keys.up = true;
                } else {
                    keys[keyName] = true;
                }
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyName] = false;
                if (keyName === 'up' && player && player.vy < 0) {
                    player.vy *= 0.5;
                }
            }, { passive: false });

            btn.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                keys[keyName] = false;
            }, { passive: false });
        }

        setupTouch(btnLeft, 'left');
        setupTouch(btnRight, 'right');
        setupTouch(btnJump, 'up');

        btnShoot.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            if (!shopOpen) shoot();
        }, { passive: false });

        shopBtn.addEventListener('click', () => {
            initAudio();
            openShop();
        });

        closeShopBtn.addEventListener('click', () => {
            closeShop();
        });

        shopPanel.addEventListener('click', (e) => {
            if (e.target === shopPanel) closeShop();
        });

        shopItems.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;

            initAudio();

            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const costume = costumes.find(c => c.id === id);
            if (!costume) return;

            if (action === 'buy') {
                if (ownedCostumeIds.includes(id)) return;
                if (totalCoins < costume.price) return;

                totalCoins -= costume.price;
                ownedCostumeIds.push(id);
                selectedCostumeId = id;
                soundBuy();
                updateCoinDisplays();
                saveProgress();
                renderShop();
            }

            if (action === 'select') {
                if (!ownedCostumeIds.includes(id)) return;
                selectedCostumeId = id;
                soundSelect();
                saveProgress();
                renderShop();
            }
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            cancelAnimationFrame(animationFrameId);

            if (gameState === 'won' && currentLevel < TOTAL_LEVELS) {
                loadLevel(currentLevel + 1);
            } else if (gameState === 'won' && currentLevel === TOTAL_LEVELS) {
                score = 0;
                scoreDisplay.innerText = score;
                loadLevel(1);
            } else {
                loadLevel(currentLevel);
            }

            update();
        });

        loadProgress();
        updateCoinDisplays();
        score = 0;
        scoreDisplay.innerText = score;
        loadLevel(1);
        update();
    });
    </script>
</body>
</html>
